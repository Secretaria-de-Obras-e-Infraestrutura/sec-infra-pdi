<style>
  :root{
    --tinta:#16182b; --suave:#4a4f6a; --fundo:#eef0f7; --papel:#fff; --linha:#cfd3e6;
    --azul:#2b2987; --azul-escuro:#1c1c66; --ouro:#d9b82f; --vermelho:#d7191c; --ok:#1b6e3c;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--fundo);color:var(--tinta);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45}
  header{background:#fff}
  .marca{max-width:760px;margin:0 auto;padding:10px 14px}
  .marca img{height:52px;width:auto;max-width:100%;display:block}
  .faixa{background:var(--azul);border-bottom:5px solid var(--ouro)}
  .faixa p{max-width:760px;margin:0 auto;padding:10px 14px;color:#fff;font-weight:700;font-size:16px}
  main{max-width:760px;margin:0 auto;padding:14px 12px 60px}
  .bloco{background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:16px;margin:0 0 14px}
  h2{margin:0 0 6px;font-size:20px;color:var(--azul-escuro)}
  h3{margin:0 0 8px;font-size:16px;color:var(--azul-escuro)}
  .ajuda{color:var(--suave);font-size:15px;margin:0 0 12px}
  label.rot{display:block;font-weight:600;margin-bottom:5px}
  input[type=text],input[type=password],select,textarea{width:100%;font:inherit;color:inherit;background:#fff;
    border:1.5px solid #8b90b3;border-radius:8px;padding:11px 12px;min-height:48px}
  textarea{min-height:90px;resize:vertical}
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #1a73e8;outline-offset:1px}
  button{font:inherit;cursor:pointer}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 16px;
    border-radius:9px;border:2px solid var(--azul);background:var(--azul);color:#fff;font-weight:700;text-align:center;text-decoration:none}
  .btn:hover{background:var(--azul-escuro)}
  .btn.sec{background:#fff;color:var(--azul)}
  .btn.sec:hover{background:#e8e9f7}
  .btn.ok{background:var(--ok);border-color:var(--ok)}
  .btn.perigo{background:#fff;border-color:var(--vermelho);color:var(--vermelho)}
  .btn.pequeno{min-height:42px;padding:6px 12px;font-size:15px}
  .btn.cheio{width:100%}
  .btn[disabled]{opacity:.6;cursor:wait}
  .linha-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .linha-btn .btn{flex:1 1 150px}
  .erro{background:#fdecea;border:1px solid #f0b4af;color:#7a1710;border-radius:8px;padding:10px 12px;margin-top:12px;font-size:16px}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
  .check input{width:22px;height:22px;margin-top:2px;flex:none}

  /* topo do app e abas */
  .topo-app{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .topo-app b{font-size:18px}
  .topo-app small{color:var(--suave);display:block}
  .abas{display:flex;gap:6px;margin-bottom:10px}
  .abas button{flex:1;min-height:48px;font-size:15px;padding:4px 6px;border:2px solid var(--linha);background:#fff;border-radius:9px;font-weight:700;color:var(--suave)}
  .abas button[aria-selected=true]{border-color:var(--azul);background:var(--azul);color:#fff}
  .abas .n{display:inline-block;min-width:24px;padding:0 6px;margin-left:4px;border-radius:12px;background:var(--ouro);color:var(--tinta);font-size:14px}
  .filtros{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .filtros select{flex:1 1 180px}
  .filtros input{flex:2 1 220px}

  /* cartões de pedido */
  .cartao{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--linha);border-left:6px solid var(--azul);
    border-radius:10px;padding:12px 14px;margin-bottom:10px;color:inherit}
  .cartao.atrasado{border-left-color:var(--vermelho)}
  .cartao.ok{border-left-color:var(--ok)}
  .cartao .l1{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
  .cartao .prot{font-weight:800;color:var(--azul-escuro)}
  .cartao .tp{font-weight:600;margin-top:4px}
  .cartao .on{margin-top:2px}
  .cartao .mt{color:var(--suave);font-size:14px;margin-top:4px}
  .badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:14px;font-weight:700}
  .st-Recebido{background:#fde7c7;color:#7a4b00}
  .st-Em-análise{background:#dbe8fb;color:#123a7a}
  .st-Em-atendimento{background:#fff3b0;color:#5c4a00}
  .st-Atendido{background:#cdebd5;color:#0e4a26}
  .st-Não-procede{background:#e5e5e9;color:#3b3d4d}
  .vazio{text-align:center;color:var(--suave);padding:26px 10px}

  /* detalhe */
  .overlay{position:fixed;inset:0;background:var(--fundo);overflow-y:auto;z-index:50}
  .overlay .in{max-width:760px;margin:0 auto;padding:0 12px 80px}
  .barra{position:sticky;top:0;background:var(--azul);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;z-index:2}
  .barra button{background:transparent;border:2px solid #fff;color:#fff;border-radius:8px;min-height:42px;padding:4px 14px;font-weight:700}
  .barra span{font-weight:800}
  dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:6px 10px}
  dt{color:var(--suave);font-size:15px}
  dd{margin:0;word-break:break-word}
  .foto-box img{max-width:100%;border-radius:8px;border:1px solid var(--linha);margin-top:8px;display:block}
  #previa{max-width:100%;max-height:240px;border-radius:8px;margin-top:10px;display:block;border:1px solid var(--linha)}
  .aviso-atraso{background:#fdecea;border:1px solid #f0b4af;color:#7a1710;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-weight:600}

  /* resumo */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .kpi{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:12px}
  .kpi b{display:block;font-size:30px;line-height:1.1;color:var(--azul-escuro)}
  .kpi span{color:var(--suave);font-size:14px}
  .kpi.alerta b{color:var(--vermelho)}
  .barra-l{display:flex;align-items:center;gap:8px;margin:6px 0}
  .barra-l .nm{flex:0 0 36%;font-size:15px;overflow-wrap:anywhere}
  .barra-l .tr{flex:1;background:#e8e9f7;border-radius:6px;height:18px;overflow:hidden}
  .barra-l .pr{height:100%;background:var(--azul)}
  .barra-l .vl{flex:0 0 104px;text-align:right;font-weight:700;font-size:15px}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 18px;
    border-radius:10px;z-index:99;max-width:90%;text-align:center}
  @media (min-width:600px){.kpis{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<main>

<section id="tela-login" class="bloco">
  <h2>Entrar</h2>
  <p class="ajuda">Digite o código de acesso que a Secretaria passou para você. Ele é pessoal, não compartilhe.</p>
  <label class="rot" for="codigo">Código de acesso</label>
  <input type="text" id="codigo" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="12">
  <label class="check"><input type="checkbox" id="lembrar" checked><span>Manter conectado neste aparelho</span></label>
  <div class="erro" id="erro-login" hidden></div>
  <div class="linha-btn"><button class="btn cheio" id="btn-entrar" type="button">Entrar</button></div>
</section>

<section id="tela-app" hidden>
  <div class="topo-app">
    <div><b id="u-nome"></b><small id="u-perfil"></small></div>
    <div class="linha-btn" style="margin:0;flex-wrap:nowrap">
      <button class="btn sec pequeno" id="btn-atualizar" type="button" style="flex:none">Atualizar</button>
      <button class="btn sec pequeno" id="btn-sair" type="button" style="flex:none">Sair</button>
    </div>
  </div>

  <div class="abas" role="tablist">
    <button role="tab" data-aba="abertos" aria-selected="true">Para atender <span class="n" id="n-abertos">0</span></button>
    <button role="tab" data-aba="atendidos" aria-selected="false">Atendidos</button>
    <button role="tab" data-aba="resumo" aria-selected="false" id="aba-resumo" hidden>Resumo</button>
  </div>

  <div id="area-lista">
    <div class="filtros">
      <select id="f-tipo" aria-label="Filtrar por tipo"></select>
      <input type="text" id="busca" placeholder="Buscar comunidade ou protocolo" aria-label="Buscar">
    </div>
    <div id="lista" aria-live="polite"></div>
  </div>
  <div id="area-resumo" hidden></div>
  <div class="erro" id="erro-app" hidden></div>
</section>

</main>

<div id="detalhe" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Detalhes do pedido">
  <div class="barra"><button id="btn-voltar" type="button">Voltar</button><span id="d-titulo"></span></div>
  <div class="in" id="d-corpo"></div>
</div>
<div id="toast" hidden></div>

<script>
const API = "https://script.google.com/macros/s/AKfycby-teYzwq5xMIfs9F9t247UmmIi0-BK2QGTs7WCE3feivAfpnyXHF_gWzAAkPT-cxOR/exec";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const semAcento = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const ABERTOS = ["Recebido", "Em análise", "Em atendimento"];

let usuario = null, codigo = "", pedidos = [], aba = "abertos", atual = null, fotoAtend = "";

/* ---------- comunicação com o servidor ---------- */
async function chamar(dados) {
  let r;
  try {
    r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(dados) });
  } catch (e) { throw new Error("Sem conexão com o servidor. Verifique a internet e tente de novo."); }
  const t = await r.text();
  let j;
  try { j = JSON.parse(t); } catch (e) { throw new Error("O servidor respondeu de forma inesperada. Tente de novo."); }
  if (!j.ok) throw new Error(j.erro || "Erro no servidor.");
  return j;
}
function guardar(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} }
function ler(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function aviso(t) {
  const el = $("toast"); el.textContent = t; el.hidden = false;
  clearTimeout(aviso.t); aviso.t = setTimeout(() => { el.hidden = true; }, 3500);
}

/* ---------- login ---------- */
async function entrar(cod, lembrar) {
  $("erro-login").hidden = true;
  const btn = $("btn-entrar"); btn.disabled = true; btn.textContent = "Entrando…";
  try {
    const j = await chamar({ acao: "listar", codigo: cod });
    codigo = cod; usuario = j.usuario; pedidos = j.pedidos;
    guardar("pin_codigo", lembrar ? cod : null);
    montarApp();
  } catch (e) {
    guardar("pin_codigo", null);
    $("tela-login").hidden = false; $("tela-app").hidden = true;
    $("erro-login").textContent = e.message; $("erro-login").hidden = false;
  } finally { btn.disabled = false; btn.textContent = "Entrar"; }
}
$("btn-entrar").addEventListener("click", () => {
  const c = $("codigo").value.trim();
  if (c.length < 6) { $("erro-login").textContent = "Digite o código completo."; $("erro-login").hidden = false; return; }
  entrar(c, $("lembrar").checked);
});
$("codigo").addEventListener("input", (e) => { e.target.value = e.target.value.toUpperCase(); });
$("codigo").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-entrar").click(); });
$("btn-sair").addEventListener("click", () => {
  guardar("pin_codigo", null); usuario = null; codigo = ""; pedidos = [];
  $("codigo").value = ""; $("tela-app").hidden = true; $("tela-login").hidden = false; fecharDetalhe();
});

/* ---------- montagem da tela ---------- */
function montarApp() {
  $("tela-login").hidden = true; $("tela-app").hidden = false;
  $("u-nome").textContent = usuario.nome;
  $("u-perfil").textContent = "Equipe: " + usuario.perfil;
  $("aba-resumo").hidden = !usuario.triagem;
  const sel = $("f-tipo");
  if (usuario.tipos.length > 1) {
    sel.innerHTML = '<option value="">Todos os tipos</option>' + usuario.tipos.map((t) => `<option>${esc(t)}</option>`).join("");
    sel.hidden = false;
  } else { sel.innerHTML = ""; sel.hidden = true; }
  trocarAba("abertos");
}

document.querySelectorAll(".abas button").forEach((b) => b.addEventListener("click", () => trocarAba(b.dataset.aba)));
function trocarAba(nome) {
  aba = nome;
  document.querySelectorAll(".abas button").forEach((b) => b.setAttribute("aria-selected", b.dataset.aba === nome));
  $("area-lista").hidden = nome === "resumo";
  $("area-resumo").hidden = nome !== "resumo";
  if (nome === "resumo") carregarResumo(); else renderLista();
}
$("f-tipo").addEventListener("change", renderLista);
$("busca").addEventListener("input", renderLista);

function idade(p) {
  if (p.dias === null || p.dias === undefined) return "";
  return p.dias === 0 ? "chegou hoje" : p.dias === 1 ? "há 1 dia" : "há " + p.dias + " dias";
}
function renderLista() {
  const tipo = $("f-tipo").value, q = semAcento($("busca").value);
  let ls = pedidos.filter((p) => (aba === "abertos") === ABERTOS.includes(p.status));
  $("n-abertos").textContent = pedidos.filter((p) => ABERTOS.includes(p.status)).length;
  if (tipo) ls = ls.filter((p) => p.tipo === tipo);
  if (q) ls = ls.filter((p) => semAcento([p.protocolo, p.comunidade, p.referencia, p.problema, p.tipo, p.nome].join(" ")).includes(q));
  ls.sort((a, b) => aba === "abertos" ? a.criadoTs - b.criadoTs : (b.atendidoTs || b.criadoTs) - (a.atendidoTs || a.criadoTs));
  if (!ls.length) {
    $("lista").innerHTML = `<div class="vazio">${aba === "abertos" ? "Nenhum pedido para atender." : "Nenhum pedido atendido ainda."}</div>`;
    return;
  }
  $("lista").innerHTML = ls.map((p) => {
    const atras = ABERTOS.includes(p.status) && p.dias >= 7;
    const cls = p.status === "Atendido" ? "ok" : atras ? "atrasado" : "";
    const meta = ABERTOS.includes(p.status)
      ? `Enviado em ${esc(p.criadoEm)} (${idade(p)})`
      : p.status === "Atendido" ? `Atendido em ${esc(p.atendidoEm)} por ${esc(p.atendidoPor)}` : `Enviado em ${esc(p.criadoEm)}`;
    return `<button class="cartao ${cls}" data-p="${esc(p.protocolo)}">
      <div class="l1"><span class="prot">${esc(p.protocolo)}</span><span class="badge st-${esc(p.status).replace(/ /g, "-")}">${esc(p.status)}</span></div>
      <div class="tp">${esc(p.tipo)}${p.problema ? ": " + esc(p.problema) : ""}</div>
      <div class="on">${esc(p.comunidade)}${p.referencia ? " – " + esc(p.referencia) : ""}</div>
      <div class="mt">${meta}</div></button>`;
  }).join("");
  $("lista").querySelectorAll(".cartao").forEach((c) => c.addEventListener("click", () => abrirDetalhe(c.dataset.p)));
}

async function recarregar(silencioso) {
  const btn = $("btn-atualizar"); btn.disabled = true;
  $("erro-app").hidden = true;
  try {
    const j = await chamar({ acao: "listar", codigo });
    pedidos = j.pedidos; usuario = j.usuario;
    if (aba === "resumo") carregarResumo(); else renderLista();
    if (!silencioso) aviso("Lista atualizada");
  } catch (e) { $("erro-app").textContent = e.message; $("erro-app").hidden = false; }
  finally { btn.disabled = false; }
}
$("btn-atualizar").addEventListener("click", () => recarregar(false));
document.addEventListener("visibilitychange", () => { if (!document.hidden && usuario && $("detalhe").hidden) recarregar(true); });

/* ---------- detalhe do pedido ---------- */
function linkTel(p) {
  const d = String(p.telefone).replace(/\D/g, "");
  if (d.length < 10) return "";
  let h = `<a class="btn sec pequeno" href="tel:+55${d}">Ligar</a>`;
  if (p.whatsapp) h += `<a class="btn sec pequeno" href="https://wa.me/55${d}" target="_blank" rel="noopener">WhatsApp</a>`;
  return h;
}
function linkMapa(p) {
  const tem = typeof p.lat === "number" && typeof p.lng === "number";
  if (tem) return `<a class="btn pequeno" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank" rel="noopener">Como chegar</a>
    <a class="btn sec pequeno" href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" rel="noopener">Ver no mapa</a>`;
  return `<a class="btn sec pequeno" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.comunidade + ", Pindaí, BA")}" target="_blank" rel="noopener">Buscar comunidade no mapa</a>`;
}

function abrirDetalhe(protocolo) {
  atual = pedidos.find((p) => p.protocolo === protocolo);
  if (!atual) return;
  fotoAtend = "";
  desenharDetalhe();
  $("detalhe").hidden = false; $("detalhe").scrollTop = 0;
  document.body.style.overflow = "hidden";
}
function fecharDetalhe() { $("detalhe").hidden = true; document.body.style.overflow = ""; atual = null; }
$("btn-voltar").addEventListener("click", () => { fecharDetalhe(); renderLista(); });

function desenharDetalhe() {
  const p = atual;
  $("d-titulo").textContent = p.protocolo;
  const aberto = ABERTOS.includes(p.status);
  const atras = aberto && p.dias >= 7;
  let h = "";
  if (atras) h += `<div class="aviso-atraso" style="margin-top:12px">Pedido aberto ${idade(p)}.</div>`;
  h += `<div class="bloco" style="margin-top:12px"><span class="badge st-${esc(p.status).replace(/ /g, "-")}">${esc(p.status)}</span>
    <h2 style="margin-top:10px">${esc(p.tipo)}</h2><div>${esc(p.problema)}</div></div>`;

  h += `<div class="bloco"><h3>Onde</h3><dl><dt>Comunidade</dt><dd>${esc(p.comunidade)}</dd>
    <dt>Referência</dt><dd>${esc(p.referencia) || "Não informada"}</dd></dl>
    <div class="linha-btn">${linkMapa(p)}</div></div>`;

  h += `<div class="bloco"><h3>Quem pediu</h3><dl><dt>Nome</dt><dd>${esc(p.nome)}</dd>
    <dt>Telefone</dt><dd>${esc(p.telefone)}${p.whatsapp ? " (WhatsApp)" : ""}</dd></dl>
    <div class="linha-btn">${linkTel(p)}</div></div>`;

  h += `<div class="bloco"><h3>O pedido</h3><dl><dt>Enviado em</dt><dd>${esc(p.criadoEm)}</dd>
    <dt>Descrição</dt><dd>${esc(p.descricao) || "Sem descrição"}</dd></dl>
    <div class="foto-box" id="foto-morador">${p.temFoto ? '<button class="btn sec pequeno" type="button" id="btn-foto-m" style="margin-top:10px">Ver foto do morador</button>' : '<p class="ajuda" style="margin:10px 0 0">O morador não enviou foto.</p>'}</div></div>`;

  if (p.iniciadoEm || p.atendidoEm || p.obsAtendimento || p.obsSecretaria) {
    h += `<div class="bloco"><h3>Andamento</h3><dl>`;
    if (p.iniciadoEm) h += `<dt>Iniciado</dt><dd>${esc(p.iniciadoEm)}<br>por ${esc(p.iniciadoPor)}</dd>`;
    if (p.atendidoEm) h += `<dt>Atendido</dt><dd>${esc(p.atendidoEm)}<br>por ${esc(p.atendidoPor)}</dd>`;
    if (p.obsAtendimento) h += `<dt>Observação</dt><dd>${esc(p.obsAtendimento)}</dd>`;
    if (p.obsSecretaria) h += `<dt>Secretaria</dt><dd>${esc(p.obsSecretaria)}</dd>`;
    h += `</dl>`;
    if (p.temFotoServico) h += `<div class="foto-box" id="foto-servico"><button class="btn sec pequeno" type="button" id="btn-foto-s" style="margin-top:10px">Ver foto do serviço realizado</button></div>`;
    h += `</div>`;
  }

  // ações
  h += `<div class="bloco" id="acoes"><h3>O que fazer</h3><div id="acoes-corpo">`;
  if (aberto) {
    h += `<div class="linha-btn" style="margin-top:0">`;
    if (usuario.triagem && p.status === "Recebido") h += `<button class="btn sec" type="button" data-op="analisar">Colocar em análise</button>`;
    if (p.status !== "Em atendimento") h += `<button class="btn" type="button" data-op="iniciar">Iniciar atendimento</button>`;
    h += `<button class="btn ok" type="button" id="btn-abrir-atender">Marcar como atendido</button>`;
    h += `</div>`;
    if (usuario.triagem) h += `<div class="linha-btn"><button class="btn perigo" type="button" id="btn-abrir-np">Não procede</button></div>`;
  } else if (usuario.admin) {
    h += `<div class="linha-btn" style="margin-top:0"><button class="btn sec" type="button" data-op="reabrir">Reabrir este pedido</button></div>`;
  } else {
    h += `<p class="ajuda" style="margin:0">Este pedido já foi encerrado.</p>`;
  }
  h += `</div><div class="erro" id="erro-det" hidden></div></div>`;
  $("d-corpo").innerHTML = h;

  if ($("btn-foto-m")) $("btn-foto-m").addEventListener("click", () => carregarFoto("morador", "foto-morador"));
  if ($("btn-foto-s")) $("btn-foto-s").addEventListener("click", () => carregarFoto("servico", "foto-servico"));
  document.querySelectorAll("[data-op]").forEach((b) => b.addEventListener("click", () => enviarOp(b.dataset.op, b)));
  if ($("btn-abrir-atender")) $("btn-abrir-atender").addEventListener("click", formAtender);
  if ($("btn-abrir-np")) $("btn-abrir-np").addEventListener("click", formNaoProcede);
}

async function carregarFoto(qual, alvoId) {
  const alvo = $(alvoId); alvo.innerHTML = '<p class="ajuda" style="margin:10px 0 0">Carregando foto…</p>';
  try {
    const j = await chamar({ acao: "foto", codigo, protocolo: atual.protocolo, qual });
    alvo.innerHTML = j.dataUrl ? `<img src="${j.dataUrl}" alt="Foto do pedido">` : '<p class="ajuda" style="margin:10px 0 0">A foto não está disponível.</p>';
  } catch (e) { alvo.innerHTML = `<div class="erro">${esc(e.message)}</div>`; }
}

function erroDet(t) { const e = $("erro-det"); e.textContent = t; e.hidden = !t; }

async function enviarOp(op, btn, extra) {
  erroDet("");
  const todos = document.querySelectorAll("#acoes button"); todos.forEach((b) => (b.disabled = true));
  try {
    const j = await chamar(Object.assign({ acao: "mudar", codigo, protocolo: atual.protocolo, op }, extra || {}));
    const i = pedidos.findIndex((p) => p.protocolo === j.pedido.protocolo);
    if (i > -1) pedidos[i] = j.pedido;
    atual = j.pedido; fotoAtend = "";
    desenharDetalhe();
    aviso(op === "atender" ? "Atendimento registrado" : op === "reabrir" ? "Pedido reaberto" : "Situação atualizada");
  } catch (e) { todos.forEach((b) => (b.disabled = false)); erroDet(e.message); }
}

function formAtender() {
  const obrig = !usuario.triagem;
  $("acoes-corpo").innerHTML = `
    <label class="rot" for="a-foto">Foto do serviço realizado ${obrig ? "(obrigatória)" : "(opcional)"}</label>
    <input type="file" id="a-foto" accept="image/*" capture="environment">
    <img id="previa" alt="Prévia da foto" hidden>
    <label class="rot" for="a-obs" style="margin-top:14px">O que foi feito <span class="ajuda" style="display:inline">(opcional)</span></label>
    <textarea id="a-obs" maxlength="500" placeholder="Ex.: lâmpada trocada, poste funcionando."></textarea>
    <label class="check"><input type="checkbox" id="a-gps" checked><span>Registrar a localização de onde o serviço foi feito</span></label>
    <div class="linha-btn"><button class="btn ok" type="button" id="a-enviar">Confirmar atendimento</button>
    <button class="btn sec" type="button" id="a-cancelar">Cancelar</button></div>`;
  $("a-cancelar").addEventListener("click", desenharDetalhe);
  $("a-foto").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { fotoAtend = await comprimir(f); $("previa").src = fotoAtend; $("previa").hidden = false; erroDet(""); }
    catch (_) { fotoAtend = ""; erroDet("Não foi possível ler essa foto. Tente outra."); }
  });
  $("a-enviar").addEventListener("click", confirmarAtender);
}

function posicao() {
  return new Promise((res) => {
    if (!("geolocation" in navigator)) return res(null);
    navigator.geolocation.getCurrentPosition((p) => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
  });
}
async function confirmarAtender() {
  erroDet("");
  if (!usuario.triagem && !fotoAtend) { erroDet("Anexe a foto do serviço realizado."); return; }
  const btn = $("a-enviar"); btn.disabled = true; btn.textContent = "Enviando…";
  const extra = { obs: $("a-obs").value.trim(), foto: fotoAtend };
  if ($("a-gps").checked) {
    btn.textContent = "Buscando localização…";
    const pos = await posicao();
    if (pos) { extra.lat = pos.lat; extra.lng = pos.lng; }
    btn.textContent = "Enviando…";
  }
  await enviarOp("atender", btn, extra);
  if ($("a-enviar")) { $("a-enviar").disabled = false; $("a-enviar").textContent = "Confirmar atendimento"; }
}

function formNaoProcede() {
  $("acoes-corpo").innerHTML = `
    <label class="rot" for="np-obs">Motivo (o morador poderá ser informado)</label>
    <textarea id="np-obs" maxlength="500" placeholder="Ex.: estrada estadual, fora da competência do município."></textarea>
    <div class="linha-btn"><button class="btn perigo" type="button" id="np-enviar">Confirmar "Não procede"</button>
    <button class="btn sec" type="button" id="np-cancelar">Cancelar</button></div>`;
  $("np-cancelar").addEventListener("click", desenharDetalhe);
  $("np-enviar").addEventListener("click", () => {
    const o = $("np-obs").value.trim();
    if (o.length < 5) { erroDet("Explique o motivo em poucas palavras."); return; }
    enviarOp("nao_procede", $("np-enviar"), { obs: o });
  });
}

function comprimir(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1200, s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("foto")); };
    img.src = url;
  });
}

/* ---------- resumo (Secretário e Triagem) ---------- */
async function carregarResumo() {
  const alvo = $("area-resumo");
  alvo.innerHTML = '<div class="vazio">Carregando resumo…</div>';
  try {
    const j = await chamar({ acao: "resumo", codigo });
    desenharResumo(j.resumo);
  } catch (e) { alvo.innerHTML = `<div class="erro">${esc(e.message)}</div>`; }
}
function barras(itens, max) {
  return itens.map((i) => `<div class="barra-l"><span class="nm">${esc(i.nome)}</span>
    <span class="tr"><span class="pr" style="display:block;width:${max ? Math.round((i.valor / max) * 100) : 0}%"></span></span>
    <span class="vl">${esc(i.texto == null ? i.valor : i.texto)}</span></div>`).join("");
}
function desenharResumo(r) {
  const st = Object.keys(r.porStatus).map((k) => ({ nome: k, valor: r.porStatus[k] }));
  const tp = Object.keys(r.porTipo).map((t) => {
    const total = Object.values(r.porTipo[t]).reduce((a, b) => a + b, 0);
    const abertos = ABERTOS.reduce((a, s) => a + r.porTipo[t][s], 0);
    return { nome: t, valor: total, texto: total + " (" + abertos + " abertos)" };
  });
  const tm = Object.keys(r.tempoPorTipo).map((t) => ({ nome: t, valor: r.tempoPorTipo[t] || 0, texto: r.tempoPorTipo[t] == null ? "-" : r.tempoPorTipo[t] + " d" }));
  const co = r.porComunidade.map((c) => ({ nome: c.nome, valor: c.total, texto: c.total + " (" + c.abertos + ")" }));
  const mx = (a) => Math.max(1, ...a.map((x) => x.valor));
  let h = `<div class="kpis">
    <div class="kpi"><b>${r.total}</b><span>Pedidos no total</span></div>
    <div class="kpi"><b>${r.abertos}</b><span>Em aberto</span></div>
    <div class="kpi"><b>${r.atendidos}</b><span>Atendidos</span></div>
    <div class="kpi"><b>${r.novos7}</b><span>Novos nos últimos 7 dias</span></div>
    <div class="kpi ${r.atrasados ? "alerta" : ""}"><b>${r.atrasados}</b><span>Abertos há mais de ${r.diasAlerta} dias</span></div>
    <div class="kpi"><b>${r.tempoMedio == null ? "-" : r.tempoMedio}</b><span>Dias, em média, para atender</span></div></div>`;
  h += `<div class="bloco"><h3>Por situação</h3>${barras(st, mx(st))}</div>`;
  h += `<div class="bloco"><h3>Por tipo de pedido</h3>${barras(tp, mx(tp))}</div>`;
  h += `<div class="bloco"><h3>Tempo médio para atender</h3>${barras(tm, mx(tm))}</div>`;
  h += `<div class="bloco"><h3>Comunidades com mais pedidos</h3><p class="ajuda">Total (em aberto)</p>${co.length ? barras(co, mx(co)) : "<p class='ajuda'>Sem dados.</p>"}</div>`;
  if (r.listaAtrasados.length) {
    h += `<div class="bloco"><h3>Abertos há mais de ${r.diasAlerta} dias</h3>` + r.listaAtrasados.map((a) =>
      `<button class="cartao atrasado" data-p="${esc(a.protocolo)}"><div class="l1"><span class="prot">${esc(a.protocolo)}</span><span class="badge st-${esc(a.status).replace(/ /g, "-")}">${esc(a.status)}</span></div>
      <div class="tp">${esc(a.tipo)}</div><div class="mt">${esc(a.comunidade)}, aberto há ${a.dias} dias</div></button>`).join("") + `</div>`;
  }
  $("area-resumo").innerHTML = h;
  $("area-resumo").querySelectorAll(".cartao").forEach((c) => c.addEventListener("click", () => abrirDetalhe(c.dataset.p)));
}

/* ---------- início ---------- */
(function iniciar() {
  const salvo = ler("pin_codigo");
  if (salvo) { $("codigo").value = salvo; entrar(salvo, true); }
})();
</script>
